<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Video Studio</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090b12;color:#fff;
 font-family:Arial,sans-serif;padding:20px;
}
.app{max-width:850px;margin:auto}
header{padding:15px 0 25px;border-bottom:1px solid #252a38}
h1{font-size:26px;margin:0}
h1 span{color:#9b8cff}
.sub{color:#9299aa;font-size:13px}
.card{
 background:#131725;border:1px solid #292f40;
 padding:20px;border-radius:15px;margin-top:20px;
}
h3{margin-top:0}
.upload{
 border:2px dashed #555b75;border-radius:12px;
 padding:30px 12px;text-align:center;cursor:pointer;
 color:#b5b9cc;
}
.upload input{display:none}
#preview{width:100%;max-height:300px;object-fit:contain;
 display:none;margin-top:15px;border-radius:10px}
label{display:block;margin:18px 0 8px;color:#c6c9d7}
textarea,select{
 width:100%;background:#0b0e18;color:white;
 border:1px solid #343b50;border-radius:9px;
 padding:13px;font-size:15px;
}
textarea{min-height:110px;resize:vertical}
button{
 border:0;border-radius:9px;padding:14px;
 font-size:15px;font-weight:bold;cursor:pointer;
}
.generate{
 width:100%;margin-top:20px;
 color:white;background:linear-gradient(100deg,#7258e8,#a34edc);
}
.generate:active{opacity:.8}
.note{font-size:12px;color:#9299aa;line-height:1.6}
#status{margin-top:15px;color:#b9aaff;line-height:1.5}
footer{text-align:center;color:#72798b;font-size:12px;padding:25px}
</style>
</head>
<body>
<div class="app">
<header>
<h1>MY <span>AI VIDEO</span> STUDIO</h1>
<p class="sub">Your Personal Cinematic Video Creator</p>
</header>

<div class="card">
<h3>🎬 Create Your Video</h3>

<label>Upload Your Image</label>
<label class="upload" for="photo">
📁<br><br>Choose Image<br>
<small>JPG / PNG / WEBP</small>
<input type="file" id="photo" accept="image/*">
</label>
<img id="preview">

<label>Motion Prompt</label>
<textarea id="prompt" placeholder="Describe how you want your image to move..."></textarea>

<label>Video Duration</label>
<select id="duration">
<option value="5">5 Seconds</option>
<option value="10">10 Seconds</option>
</select>

<label>Aspect Ratio</label>
<select id="ratio">
<option value="9:16">9:16 - YouTube Shorts</option>
<option value="16:9">16:9 - YouTube Video</option>
</select>

<label>Video Quality</label>
<select id="quality">
<option value="720p">720p HD</option>
<option value="480p">480p</option>
</select>

<button class="generate" onclick="generate()">
✨ GENERATE VIDEO
</button>

<div id="status"></div>
<p class="note">
Your studio interface is ready. Connect an AI video generation engine to start creating actual videos.
</p>
</div>

<footer>MY AI VIDEO STUDIO · Personal Creator Workspace</footer>
</div>

<script>
const photo=document.getElementById('photo');
const preview=document.getElementById('preview');
let imageURL='';

photo.addEventListener('change',()=>{
 const file=photo.files[0];
 if(!file)return;
 if(!file.type.startsWith('image/')){
 alert('Please select an image');
 return;
 }
 if(imageURL)URL.revokeObjectURL(imageURL);
 imageURL=URL.createObjectURL(file);
 preview.src=imageURL;
 preview.style.display='block';
});

function generate(){
 const prompt=document.getElementById('prompt').value.trim();
 if(!photo.files.length){
 alert('Please upload an image first');
 return;
 }
 if(!prompt){
 alert('Please enter a motion prompt');
 return;
 }
 document.getElementById('status').innerText=
 'Your image and prompt are ready. AI generation engine is not connected yet.';
}
</script>
</body>
  </html>
